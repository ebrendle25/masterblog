{% extends "base.html" %}

{% block title %}New Post – {{ super() }}{% endblock %}

{% block content %}
    <div class="form-page">
        <main class="card">
            <h1>Write a new post</h1>
            <p class="subtitle">Share your thoughts with the Masterblog.</p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('add') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="author">Autor</label>
                    <input type="text" id="author" name="author" placeholder="Your Name" value="{{ author }}" required>
                </div>

                <div class="field">
                    <label for="title">Titel</label>
                    <input type="text" id="title" name="title" placeholder="What is it about?" value="{{ title }}" required>
                </div>

                <div class="field">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" placeholder="Write your post …" required>{{ content }}</textarea>
                </div>

                <div class="actions">
                    <a class="back" href="{{ url_for('index') }}">← Back to Overview</a>
                    <button type="submit">Publish Post</button>
                </div>
            </form>
        </main>
    </div>
{% endblock %}
