<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuer Post – Masterblog</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #dfe7f1 100%);
            color: #1f2933;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(31, 41, 51, 0.12);
            padding: 2rem 2.25rem;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.6rem;
        }

        .subtitle {
            margin: 0 0 1.75rem;
            color: #6b7785;
            font-size: 0.95rem;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            font: inherit;
            background: #f9fbfd;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: #ffffff;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.75rem;
        }

        .back {
            color: #6b7785;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: #1f2933;
            text-decoration: underline;
        }

        button {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            color: #dc2626;
            font-weight: 500;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Neuen Post schreiben</h1>
        <p class="subtitle">Teile deine Gedanken mit dem Masterblog.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="{{ category }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('add') }}" method="POST">
            <div class="field">
                <label for="author">Autor</label>
                <input type="text" id="author" name="author" placeholder="Dein Name" value="{{ author }}" required>
            </div>

            <div class="field">
                <label for="title">Titel</label>
                <input type="text" id="title" name="title" placeholder="Worum geht es?" value="{{ title }}" required>
            </div>

            <div class="field">
                <label for="content">Inhalt</label>
                <textarea id="content" name="content" placeholder="Schreib deinen Post …" required>{{ content }}</textarea>
            </div>

            <div class="actions">
                <a class="back" href="{{ url_for('index') }}">← Zurück zur Übersicht</a>
                <button type="submit">Veröffentlichen</button>
            </div>
        </form>
    </main>
</body>
</html>
