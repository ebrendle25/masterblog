{% extends "base.html" %}

{% block title %}Update Post – {{ super() }}{% endblock %}

{% block content %}

    <div class="form-page">
        <main class="card">
            <h1>Update Blog Post</h1>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('update', post_id=post.id) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" placeholder="Your Name" value="{{ post.author }}" required>
                </div>

                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="What is it about?" value="{{ post.title }}" required>
                </div>

                <div class="field">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" placeholder="Write your post …" required>{{ post.content }}</textarea>
                </div>

                <div class="actions">
                    <a class="back" href="{{ url_for('index') }}">← Back to Overview</a>
                    <button type="submit">Update Post</button>
                </div>
            </form>
        </main>
    </div>
{% endblock %}
