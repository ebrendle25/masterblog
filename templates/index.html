<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('index') }}">Masterblog</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a class="nav-button" href="{{ url_for('add') }}">+ Neuer Post</a></li>
        </ul>
    </nav>

    <main class="content">
        <h1>Welcome to My Flask Blog!</h1>

        {% for post in posts %}
            <div class="post">
                <h2>{{ post.title }} {{ post.id }}</h2>
                <p><em>Written by {{ post.author }}</em></p>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
    </main>
</body>
</html>
